name: Main

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'main'

jobs:
  build:
    name: Build and test
    runs-on: als-huge

    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y \
            golang \
            meson \
            gcc-c++ \
            libapt-devel \
            'pkgconfig(systemd)'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/... ./pkg/...

      - name: Setup
        run: meson setup _build

      - name: Build
        run: meson compile -C _build

  get-release:
    name: Get release for RPM package
    runs-on: als-tiny
    if: github.event_name != 'pull_request'

    outputs:
      release: ${{ steps.get_release.outputs.release }}
    steps:
      - name: Get release
        id: get_release
        run: |
          echo "release=$(date +%s)" >> $FORGEJO_OUTPUT

  rpm-build:
    if: github.event_name != 'pull_request'
    name: RPM build for ${{ matrix.branch }} on ${{ matrix.arch }} and uploading
    runs-on: als-huge
    container:
      image: altlinux.space/alt-hub/sisyphus/flatpak-builder:latest
      options: --platform linux/${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        branch:
          - sisyphus
          - p11
        arch:
          - amd64
          - arm64

    needs:
      - build
      - get-release

    steps:
      - name: Install utils
        run: |
          apt-get update
          apt-get install -y meson jq /usr/bin/add_changelog golang fuse-overlayfs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare RPM build
        run: |
          ./build-aux/altlinux/prepare ${{ needs.get-release.outputs.release }}
          git add .

      - name: Build RPM
        run: |
          if [ '${{ matrix.branch }}' = p11 ]; then
            case '${{ matrix.arch }}' in
              amd64) rpm_arch=x86_64 ;;
              arm64) rpm_arch=aarch64 ;;
              *) exit 1 ;;
            esac

            apt_config_dir=$(mktemp -d)
            printf 'rpm [p11] http://ftp.altlinux.org/pub/distributions/ALTLinux p11/branch/%s classic\nrpm [p11] http://ftp.altlinux.org/pub/distributions/ALTLinux p11/branch/noarch classic\n' \
              "$rpm_arch" > "$apt_config_dir/sources.list"
            printf 'Dir::Etc::SourceList "%s/sources.list";\nDir::Etc::SourceParts "/var/empty";\n' \
              "$apt_config_dir" > "$apt_config_dir/apt.conf"

            gear-hsh --commit --no-sisyphus-check=gpg,packager \
              --apt-config="$apt_config_dir/apt.conf"
          else
            gear-hsh --commit --no-sisyphus-check=gpg,packager
          fi

      - uses: actions/upload-rpm-action@7ed97151a2a1f53a5b97f8a9f20778f771bbae59
        name: Upload RPM
        with:
          directory: ~/hasher/repo
          token: ${{ secrets.REGISTRY_TOKEN }}
          group: apm-nightly/${{ matrix.branch }}
