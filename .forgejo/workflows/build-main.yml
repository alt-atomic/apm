name: Main

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'main'

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: als-huge

    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y \
            golang \
            gcc-c++ \
            libapt-devel \
            podman \
            rsync

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/... ./pkg/...

      - name: Build test container image
        run: podman build -f Dockerfile.test -t apm-test:latest .

      - name: Containerized integration tests
        run: bash ./scripts/test-container.sh integration

      - name: D-Bus v2 E2E tests
        run: bash ./scripts/test-dbus-e2e.sh

  build:
    name: Build
    runs-on: als-huge

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            golang \
            meson \
            gcc-c++ \
            libapt-devel \
            'pkgconfig(systemd)'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        run: meson setup _build

      - name: Build
        run: meson compile -C _build

  get-release:
    name: Get release for RPM package
    runs-on: als-tiny
    if: github.event_name != 'pull_request'

    outputs:
      release: ${{ steps.get_release.outputs.release }}
    steps:
      - name: Get release
        id: get_release
        run: |
          echo "release=$(date +%s)" >> $FORGEJO_OUTPUT

  rpm-build:
    name: RPM build for ${{ matrix.branch }} for ${{ matrix.arch }} for and uploading
    runs-on: ${{ matrix.runner }}

    needs:
      - build
      - get-release
      - tests

    container:
      image: altlinux.space/alt-gnome/hasherc:latest

    strategy:
      matrix:
        branch:
          - sisyphus
          - p11
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: als-huge
          - arch: arm64
            runner: self-hosted-arm64-huge

    steps:
      - name: Install utils
        run: |
          apt-get update
          apt-get install -y meson jq /usr/bin/add_changelog golang fuse-overlayfs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare RPM build
        run: |
          ./build-aux/altlinux/prepare ${{ needs.get-release.outputs.release }}
          git add .

      - uses: actions/build-rpm-action@main
        name: Build RPMs
        with:
          branch: ${{ matrix.branch }}
          arch: ${{ matrix.arch }}

      - uses: actions/upload-rpm-action@main
        name: Upload RPMs
        if: github.event_name != 'pull_request'
        with:
          directory: ~/.cache/hasherc/apm/out/RPMS
          token: ${{ secrets.REGISTRY_TOKEN }}
          group: apm-nightly/${{ matrix.branch }}
