name: Main

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'main'

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: als-huge

    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y \
            golang \
            gcc-c++ \
            libapt-devel \
            libappstream-devel \
            'pkgconfig(systemd)' \
            podman \
            rsync

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Go vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/... ./pkg/...

      - name: Build test container image
        run: podman build -f Dockerfile.test -t apm-test:latest .

      - name: Containerized integration tests
        run: bash ./scripts/test-container.sh integration

      - name: D-Bus v2 E2E tests
        run: bash ./scripts/test-dbus-e2e.sh

  build:
    name: Build
    runs-on: als-huge
    container:
      image: altlinux.space/alt-atomic/builder-image:sisyphus

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            golang \
            graphviz \
            meson \
            gcc-c++ \
            libapt-devel \
            libappstream-devel \
            libdeser-devel \
            gobject-introspection-devel \
            vala \
            valadoc \
            'gir(Deser)=0.1' \
            'pkgconfig(systemd)'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        run: meson setup _build -Ddocumentation=true

      - name: Build
        run: meson compile -C _build

      - name: Library tests
        run: meson test -C _build --print-errorlogs

      - name: Deploy pages
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v1
        with:
          directory: ./_build/doc/apm

  get-release:
    name: Get release for RPM package
    runs-on: als-tiny
    if: github.event_name != 'pull_request'

    outputs:
      release: ${{ steps.get_release.outputs.release }}
    steps:
      - name: Get release
        id: get_release
        run: |
          echo "release=$(date +%s)" >> $FORGEJO_OUTPUT

  rpm-build:
    if: github.event_name != 'pull_request'
    name: RPM build for ${{ matrix.branch }} on ${{ matrix.arch }} and uploading
    runs-on: als-huge
    container:
      image: altlinux.space/alt-hub/${{ matrix.branch }}/flatpak-builder:latest
      options: --platform linux/${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        branch:
          - sisyphus
          # - p11
        arch:
          - amd64
          - arm64

    needs:
      - build
      - get-release
      - tests

    steps:
      - name: Install utils
        run: |
          apt-get update
          apt-get install -y meson jq /usr/bin/add_changelog golang fuse-overlayfs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare RPM build
        run: |
          ./build-aux/altlinux/prepare ${{ needs.get-release.outputs.release }}
          git add .

      - name: Build RPM
        run: |
          gear-hsh --commit --no-sisyphus-check=gpg,packager

      - uses: actions/upload-rpm-action@7ed97151a2a1f53a5b97f8a9f20778f771bbae59
        name: Upload RPM
        with:
          directory: ~/hasher/repo
          token: ${{ secrets.REGISTRY_TOKEN }}
          group: apm-nightly/${{ matrix.branch }}
